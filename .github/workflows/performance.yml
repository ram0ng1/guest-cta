name: Performance Benchmark

# Mede o carregamento da home (/) e de uma discussao (/d/<id>) vistas por um
# visitante, em um Flarum de teste com a extensao instalada e as duas funcoes
# ligadas. A discussao e onde a extensao trabalha: CTA entre posts e links
# ocultos. Em PR, compara contra a baseline do ultimo push em main.
#
# O mesmo Flarum serve de smoke test de ponta a ponta: a pagina entregue ao
# visitante nao pode conter nenhum dos links externos semeados.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# §35.13 C1 — default-deny do GITHUB_TOKEN.
permissions: {}

concurrency:
  group: perf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLARUM_TEST_DIR: /tmp/flarum-test
  EXT_DIR: ${{ github.workspace }}/extension

jobs:
  benchmark:
    name: Lighthouse (home + discussao)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: flarum
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout (extensao)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          path: extension

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, intl, mbstring, mysqlnd, openssl, pdo, pdo_mysql, tokenizer, xml, zip

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: extension/js/package-lock.json

      - name: Build dos assets JS da extensao
        working-directory: extension/js
        run: |
          npm ci
          npm run build

      - name: Esperar MariaDB
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent 2>/dev/null; then
              echo "MariaDB pronto"; break
            fi
            echo "Esperando MariaDB... ($i)"
            sleep 2
          done

      - name: Criar projeto Flarum + apontar a extensao por path
        run: |
          composer create-project --no-interaction --prefer-dist \
            "flarum/flarum:^2.0.0@beta" "${FLARUM_TEST_DIR}"
          cd "${FLARUM_TEST_DIR}"
          composer config repositories.local path "${EXT_DIR}"
          composer require "ramon/guest-cta:*@dev" --no-interaction --prefer-stable

      - name: Instalar Flarum (nao-interativo)
        working-directory: ${{ env.FLARUM_TEST_DIR }}
        run: |
          cat > install.yml <<-EOF
          baseUrl: http://127.0.0.1:8080
          databaseConfiguration:
            # Tem que ser o driver do servico acima. Com `mysql` contra um
            # MariaDB, o Laravel gera `CAST(... AS JSON)`, que o MariaDB nao
            # aceita: o install passa, mas criar um post estoura em db_error
            # (a notificacao de assinatura usa essa query).
            driver: mariadb
            host: 127.0.0.1
            port: 3306
            database: flarum
            username: root
            password: root
            prefix: flarum_
          adminUser:
            username: admin
            password: admin12345
            email: admin@test.local
          settings:
            forum_title: Guest CTA Perf Test
          EOF
          php flarum install --file=install.yml

      # Sem `|| true`: se a extensao nao ativa, nao ha o que medir.
      - name: Ativar a extensao Guest CTA
        working-directory: ${{ env.FLARUM_TEST_DIR }}
        run: |
          php flarum extension:enable ramon-guest-cta
          php flarum cache:clear
          php flarum assets:publish

      # Falha o job se o seed falhar: sem a discussao, o Lighthouse mediria um
      # 404 e o smoke test abaixo passaria por nao haver link nenhum.
      - name: Semear dados (1 discussao, 8 posts com links) e ligar as funcoes
        id: seed
        working-directory: ${{ env.FLARUM_TEST_DIR }}
        run: |
          cp "${EXT_DIR}/.github/scripts/flarum-seed.php" ./seed.php
          php seed.php
          echo "discussion=$(cat seed-discussion-id.txt)" >> "$GITHUB_OUTPUT"

      - name: Subir servidor PHP embutido
        working-directory: ${{ env.FLARUM_TEST_DIR }}
        run: |
          php -S 127.0.0.1:8080 -t public > /tmp/php.log 2>&1 &
          echo $! > /tmp/php.pid
          for i in $(seq 1 15); do
            code=$(curl -sf -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ || true)
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              echo "PHP server pronto (HTTP $code)"; break
            fi
            sleep 1
          done
          curl -sI http://127.0.0.1:8080/ | head -1

      # Ponta a ponta, num Flarum de verdade: o que o servidor entrega a um
      # visitante (HTML sem JS + documento pre-carregado + API) nao pode trazer
      # o host dos links semeados, e tem que trazer o placeholder no lugar.
      - name: Smoke test — visitante nao recebe os links
        env:
          DISCUSSION: ${{ steps.seed.outputs.discussion }}
        run: |
          set -euo pipefail
          curl -sf "http://127.0.0.1:8080/d/${DISCUSSION}" -o /tmp/guest-page.html
          curl -sf "http://127.0.0.1:8080/api/posts?filter%5Bdiscussion%5D=${DISCUSSION}" -o /tmp/guest-api.json
          for f in /tmp/guest-page.html /tmp/guest-api.json; do
            if grep -q 'links\.example' "$f"; then
              echo "::error::Link externo vazou para o visitante em $f"
              grep -o '.\{80\}links\.example.\{40\}' "$f" | head -5
              exit 1
            fi
            grep -q 'GuestCtaLink' "$f" || { echo "::error::Placeholder ausente em $f"; exit 1; }
          done
          echo "OK: nenhum link externo na pagina nem na API do visitante."

      - name: Rodar Lighthouse CI (2 URLs)
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18  # v12
        with:
          urls: |
            http://127.0.0.1:8080/
            http://127.0.0.1:8080/d/${{ steps.seed.outputs.discussion }}
          configPath: ${{ env.EXT_DIR }}/.github/lighthouserc.json
          uploadArtifacts: false
          temporaryPublicStorage: false

      - name: Mover resultados para fora do workspace do flarum
        run: |
          mkdir -p /tmp/lhci-out
          if [ -d "${FLARUM_TEST_DIR}/.lighthouseci" ]; then
            cp -r "${FLARUM_TEST_DIR}/.lighthouseci/." /tmp/lhci-out/
          elif [ -d "${GITHUB_WORKSPACE}/.lighthouseci" ]; then
            cp -r "${GITHUB_WORKSPACE}/.lighthouseci/." /tmp/lhci-out/
          fi
          ls -la /tmp/lhci-out

      # O log do Flarum e onde fica a excecao de verdade: a API so devolve o
      # codigo (`db_error`, por exemplo), nunca a mensagem.
      - name: Tornar logs visiveis em caso de falha
        if: failure()
        run: |
          echo "---- /tmp/php.log ----"
          tail -200 /tmp/php.log || true
          echo "---- storage/logs (Flarum) ----"
          grep -h -m 20 'flarum\.ERROR' "${FLARUM_TEST_DIR}"/storage/logs/*.log | cut -c1-1500 || true

      - name: Subir artefato com resultados (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lhci-pr-${{ github.event.pull_request.number }}
          path: /tmp/lhci-out
          retention-days: 14
          overwrite: true

      - name: Subir artefato com resultados (main baseline)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lhci-main
          path: /tmp/lhci-out
          retention-days: 90
          overwrite: true

  compare:
    name: Comparar PR vs main
    needs: benchmark
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Checkout (extensao — para o script de compare)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 20

      - name: Baixar resultados desta PR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: lhci-pr-${{ github.event.pull_request.number }}
          path: pr-results

      # Cross-workflow-run: baixa o ultimo artifact 'lhci-main' do
      # ultimo run com sucesso do performance.yml no branch main.
      - name: Baixar baseline do main
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151  # v21
        with:
          workflow: performance.yml
          workflow_conclusion: success
          branch: main
          name: lhci-main
          path: baseline
          if_no_artifact_found: warn

      - name: Gerar markdown comparativo
        run: |
          node .github/scripts/compare-lhci.mjs pr-results baseline > comparison.md
          echo "----"
          cat comparison.md

      - name: Encontrar comentario existente
        id: find_comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad  # v4.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: 'Performance benchmark'

      - name: Comentar (criar ou atualizar)
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9  # v5.0.0
        with:
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: comparison.md
          edit-mode: replace
